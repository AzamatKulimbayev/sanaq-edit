
<div class="small" style="margin-bottom:12px; cursor:pointer" (click)="back()">
    ← Назад к поиску
</div>

<div class="header">
    <div>
        <div class="h1">Данные хозяйства</div>
        <div class="small">ИИН/БИН: {{ iinBin }}</div>
        <div class="small" *ngIf="formType" style="color:#6b7280;">
            Форма: {{ formType === 'LPH' ? 'ЛПХ' : 'СХП' }}
        </div>
    </div>

    <span class="badge">
    {{ data?.meta?.source || mode }}
  </span>
</div>


<!-- Вкладки -->
<mat-tab-group [animationDuration]="0" [(selectedIndex)]="tabIndex">
    <!-- Личные данные -->
    <mat-tab label="Личные данные">
        <div class="section-card">
            <div style="
          display:flex;
          justify-content: space-between;
          align-items:center;
          margin-bottom:8px;">
                <div class="h2">Личная информация</div>
            </div>

            <table class="table">
                <thead>
                <tr>
                    <th>Поле</th>
                    <th>Значение</th>
                    <th>Источник</th>
                    <th style="text-align:right">Действия</th>
                </tr>
                </thead>

                <tbody>
                <tr *ngFor="let r of personalRows">
                    <td>{{ r.label }}</td>

                    <td>{{ r.value }}</td>

                    <td>
              <span
                      class="source-dot"
                      [class.src-arm]="r.source === 'ARM'"
                      [class.src-sanaq]="r.source === 'SANAQ'"
                      [class.src-canon]="r.source === 'CANON'">
              </span>
                        {{ r.source }}
                    </td>

                    <td style="text-align:right">

                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </mat-tab>


    <!-- Земля -->
    <mat-tab label="Земля">
        <div class="section-card">
            <land [iinBin]="iinBin" [table]="tableEnum.ZemlyaSanaq"
                  [columnName]="'Площадь (га)'" *ngIf="tabIndex == 1"></land>
        </div>
    </mat-tab>
    <mat-tab label="AnimalsSanaq">
        <div class="section-card">
            <land [iinBin]="iinBin" [table]="tableEnum.AnimalsSanaq" [columnName]="'Значение'" *ngIf="tabIndex == 2"></land>
        </div>
    </mat-tab>
    <mat-tab label="FishSanaq">
        <div class="section-card">
            <land [iinBin]="iinBin" [table]="tableEnum.FishSanaq" [columnName]="'Значение'" *ngIf="tabIndex == 3"></land>
        </div>
    </mat-tab>
    <mat-tab label="RasteniyaSanaq">
        <div class="section-card">
            <land [iinBin]="iinBin" [table]="tableEnum.RasteniyaSanaq" [columnName]="'Значение'" *ngIf="tabIndex == 4"></land>
        </div>
    </mat-tab>
    <mat-tab label="SaleSanaq">
        <div class="section-card">
            <land [iinBin]="iinBin" [table]="tableEnum.SaleSanaq" [columnName]="'Значение'" *ngIf="tabIndex == 5"></land>
        </div>
    </mat-tab>

    <mat-tab label="TechnicalSanaq">
        <div class="section-card">
            <land [iinBin]="iinBin" [table]="tableEnum.TechnicalSanaq" [columnName]="'Значение'" *ngIf="tabIndex == 6"></land>
        </div>
    </mat-tab>
