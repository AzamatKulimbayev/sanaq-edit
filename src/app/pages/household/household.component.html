
<div class="small" style="margin-bottom:12px; cursor:pointer" (click)="back()">← Назад к поиску</div>
<div class="header">
  <div>
    <div class="h1">Данные хозяйства</div>
    <div class="small">ИИН/БИН: {{iinBin}}</div>
  </div>
  <span class="badge">{{mode}}</span>
</div>

<mat-tab-group [animationDuration]="0" [(selectedIndex)]="tabIndex">
  <mat-tab label="Личные данные">
    <div class="section-card">
      <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:8px;">
        <div class="h2">Личная информация</div>
      </div>
      <table class="table">
        <thead>
          <tr><th>Поле</th><th>Значение</th><th>Источник</th><th style="text-align:right">Действия</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of personal">
            <td>{{r.label}}</td>
            <td>{{r.value}}</td>
            <td>
              <span class="source-dot" [class.src-arm]="r.source==='ARM'" [class.src-sanaq]="r.source==='SANAQ'" [class.src-canon]="r.source==='CANON'"></span>{{r.source}}
            </td>
            <td style="text-align:right">

            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </mat-tab>
    <mat-tab label="LphArmAnimal">
        <div class="section-card">
            <arm-lph-data [iinBin]="iinBin" [table]="tableEnum.LphArmAnimal"
                  [columnName]="'Значение'" *ngIf="tabIndex == 1"></arm-lph-data>
        </div>
    </mat-tab>
    <mat-tab label="LphArmFish">
        <div class="section-card">
            <arm-lph-data [iinBin]="iinBin" [table]="tableEnum.LphArmFish"
                  [columnName]="'Значение'" *ngIf="tabIndex == 2"></arm-lph-data>
        </div>
    </mat-tab>
    <mat-tab label="LphArmGeneral">
        <div class="section-card">
            <arm-lph-data [iinBin]="iinBin" [table]="tableEnum.LphArmGeneral"
                  [columnName]="'Значение'" *ngIf="tabIndex == 3"></arm-lph-data>
        </div>
    </mat-tab>
    <mat-tab label="LphArmarm-lph-data">
        <div class="section-card">
            <arm-lph-data [iinBin]="iinBin" [table]="tableEnum.LphArmLand"
                  [columnName]="'Значение'" *ngIf="tabIndex == 4"></arm-lph-data>
        </div>
    </mat-tab>
    <mat-tab label="LphArmPlantsTechnical">
        <div class="section-card">
            <arm-lph-data [iinBin]="iinBin" [table]="tableEnum.LphArmPlantsTechnical"
                  [columnName]="'Значение'" *ngIf="tabIndex == 5"></arm-lph-data>
        </div>
    </mat-tab>
    <mat-tab label="LphArmPlantsTechnical">
        <div class="section-card">
            <arm-lph-data [iinBin]="iinBin" [table]="tableEnum.LphArmPlantsTechnical"
                  [columnName]="'Значение'" *ngIf="tabIndex == 5"></arm-lph-data>
        </div>
    </mat-tab>

</mat-tab-group>

<div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
    <mat-dialog-actions align="end">
        <button mat-button [mat-dialog-close]="null">Отмена</button>
<!--        <button mat-raised-button color="primary" (click)="save()">Сохранить</button>-->
    </mat-dialog-actions>



</div>
